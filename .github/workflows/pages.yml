# Pubblica l'app su GitHub Pages a ogni push.
# Prerequisito (una volta sola): Settings → Pages → Source = "GitHub Actions".
name: Deploy su GitHub Pages

on:
  push:
    branches:
      - main
      - claude/galaxy-tab-note-app-hfpcbz
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
